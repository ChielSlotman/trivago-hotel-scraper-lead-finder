  <g filter="url(#soft)">
    <rect x="285" y="285" width="119" height="88" rx="18" fill="#FFFFFF"/>
    <circle cx="311" cy="314" r="12" fill="#2563EB"/>
    <rect x="332" y="306" width="50" height="12" rx="6" fill="#111827"/>
