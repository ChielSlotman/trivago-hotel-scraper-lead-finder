    <path d="M146 150c0-23 19-42 42-42h104c23 0 42 19 42 42v242H146V150z" fill="url(#hotel)"/>
    <path d="M169 151c0-12 10-22 22-22h98c12 0 22 10 22 22v22H169v-22z" fill="#0F766E"/>
    <rect x="183" y="201" width="33" height="33" rx="6" fill="#0F766E"/>
    <rect x="232" y="201" width="33" height="33" rx="6" fill="#14B8A6"/>
    <rect x="281" y="201" width="33" height="33" rx="6" fill="#0F766E"/>
    <rect x="183" y="253" width="33" height="33" rx="6" fill="#0F766E"/>
    <rect x="232" y="253" width="33" height="33" rx="6" fill="#14B8A6"/>
    <rect x="281" y="253" width="33" height="33" rx="6" fill="#0F766E"/>
    <rect x="183" y="305" width="33" height="33" rx="6" fill="#0F766E"/>
    <rect x="232" y="305" width="33" height="87" rx="7" fill="#111827"/>
    <rect x="281" y="305" width="33" height="33" rx="6" fill="#0F766E"/>
  </g>

