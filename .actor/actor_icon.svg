    <path d="M355 146c-31 0-56 25-56 56 0 42 56 95 56 95s56-53 56-95c0-31-25-56-56-56z" fill="#F59E0B"/>
    <circle cx="355" cy="203" r="21" fill="#FFFFFF"/>
