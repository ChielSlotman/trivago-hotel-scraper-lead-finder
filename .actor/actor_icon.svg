<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Hotel scraper and lead finder icon</title>
  <desc id="desc">A hotel building, map pin, contact rows, and search lens for hotel data extraction.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="44" x2="438" y2="468" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1F34"/>
    </linearGradient>
    <linearGradient id="panel" x1="85" y1="82" x2="424" y2="426" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF7F5"/>
    </linearGradient>
    <linearGradient id="hotel" x1="145" y1="118" x2="303" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F7FB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#08111F" flood-opacity=".22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#092136" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="92" fill="url(#bg)"/>
  <rect x="55" y="58" width="402" height="402" rx="92" fill="url(#panel)"/>
  <path d="M116 392h280c14 0 25 11 25 25v2H91v-2c0-14 11-25 25-25z" fill="#F59E0B" opacity=".95"/>

