name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate Actor
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Validate Apify schemas
        run: npx apify-cli validate-schema

      - name: Audit production dependencies
        run: npm audit --omit=dev
